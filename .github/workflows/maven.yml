name: FatJar bauen

on:
  push:
    branches: [ "master" ]

jobs:
  job-fatjar:
    runs-on: ubuntu-latest
    steps:
    - name: Git-Repo auschecken
      uses: actions/checkout@v7
    - name: JDK einrichten
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Execution-Bit für Maven-Wrapper setzen
      run: chmod +x mvnw
    - name: FatJar-Datei mit Maven bauen
      run: ./mvnw --batch-mode clean package
    - name: FatJar-Datei veröffentlichen
      uses: actions/upload-artifact@v7
      with:
        name: BmiRechner-FatJar
        path: target/bmirechner-*.jar
        if-no-files-found: error # Default-Wert ist (nur) "warn"; es gibt auch noch "ignore"
        retention-days: 3
